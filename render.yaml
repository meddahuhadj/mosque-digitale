# Blueprint Render — Mosqué Digital
# Backend FastAPI (WebSockets + Khutbah en direct) + Frontend PWA statique
# Le Dockerfile construit le frontend avec Vite et le servit avec le backend.
services:
  - type: web
    name: mosque-digitale
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: DEFAULT_TARGET_LANGS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: REDIS_URL
        sync: false