version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: mosque-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mosque
      POSTGRES_PASSWORD: mosque_secret
      POSTGRES_DB: mosque_digital_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosque -d mosque_digital_os"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
