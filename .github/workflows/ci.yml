name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  backend-lint-test:
    name: Backend (Python) - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Run type check (mypy)
        run: |
          pip install mypy
          mypy main.py translator.py quran_index.py --ignore-missing-imports

      - name: Run tests
        run: |
          pytest -v --tb=short

  frontend-lint-test:
    name: Frontend (Node) - Lint, Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

  frontend-pwa-build:
    name: Frontend PWA Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build PWA
        run: npm run build

      - name: Verify output
        run: |
          test -f ../dist/index.html
          test -f ../dist/sw.js
          test -f ../dist/manifest.webmanifest
          echo "Build verified successfully"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t khutbah:test .

      - name: Test health endpoint
        run: |
          docker run -d --name khutbah-test -p 8000:8000 -e ALLOW_NO_API_KEY=1 khutbah:test
          sleep 10
          curl -f http://localhost:8000/healthz
          docker stop khutbah-test
          docker rm khutbah-test

  docker-compose:
    name: Docker Compose Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose up -d redis backend
          sleep 15

      - name: Test health endpoint
        run: |
          curl -f http://localhost:8000/healthz

      - name: Cleanup
        run: docker compose down