<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a6b4a" />
<meta name="description" content="Mosqué Digital — Plateforme numérique complète pour les mosquées" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png" />
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
<title>🕌 Mosqué Digital</title>
<script>
  try {
    var _th = localStorage.getItem("theme");
    if (_th === "light" || _th === "dark") document.documentElement.setAttribute("data-theme", _th);
    var _c = localStorage.getItem("contrast");
    if (_c === "high") document.documentElement.setAttribute("data-contrast", "high");
    var _s = localStorage.getItem("senior-mode");
    if (_s === "true") document.documentElement.setAttribute("data-senior", "true");
  } catch(e) {}
</script>
<style>
  :root {
    --bg: #071310; --bg2: #0a1a15; --card: #0e2019; --card2: #0a1712;
    --line: #1d3a2c; --fg: #eaf3ec; --muted: #8fae9c;
    --accent: #1f8a5c; --accent2: #d4af37; --on-accent: #06120d;
    --danger: #e5484d; --warn: #e0a83e; --ok: #2fae66;
    --radius: 16px; --fs: 16px;
    --shadow: 0 10px 30px -12px rgba(0,0,0,.7);
    --gold-grad: linear-gradient(135deg, #f3d27a, #c9a227);
    --accent-grad: linear-gradient(135deg, #23996a, #145a3d);
    --font-heading: Georgia, "Amiri", "Noto Naskh Arabic", serif;
    --font-arabic: "Noto Naskh Arabic", "Traditional Arabic", serif;
    --ease: cubic-bezier(.4,0,.2,1);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #faf6ec; --bg2: #f3ecdb; --card: #fffdf8; --card2: #faf3e3;
      --line: #d9c99e; --fg: #182a1c; --muted: #5c6b52;
      --accent: #0f6b45; --accent2: #a3791a; --on-accent: #fff;
      --danger: #c0392b; --warn: #8b6914; --ok: #1e7a34;
      --shadow: 0 12px 32px -14px rgba(20,30,10,.16);
      --gold-grad: linear-gradient(135deg, #dfb85f, #a3791a);
      --accent-grad: linear-gradient(135deg, #148a57, #0f6b45);
    }
  }
  :root[data-theme="light"] {
    --bg: #faf6ec; --bg2: #f3ecdb; --card: #fffdf8; --card2: #faf3e3;
    --line: #d9c99e; --fg: #182a1c; --muted: #5c6b52;
    --accent: #0f6b45; --accent2: #a3791a; --on-accent: #fff;
    --danger: #c0392b; --warn: #8b6914; --ok: #1e7a34;
    --shadow: 0 12px 32px -14px rgba(20,30,10,.16);
    --gold-grad: linear-gradient(135deg, #dfb85f, #a3791a);
    --accent-grad: linear-gradient(135deg, #148a57, #0f6b45);
  }
  :root[data-contrast="high"] {
    --bg: #000; --bg2: #000; --card: #111; --card2: #000;
    --line: #444; --fg: #fff; --muted: #ccc;
    --accent: #00ff88; --accent2: #ffdd00; --on-accent: #000;
    --gold-grad: #ffdd00; --accent-grad: #00ff88;
  }
  :root[data-senior="true"] {
    --fs: 22px; --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif; font-size: var(--fs); line-height: 1.5; color: var(--fg); background: var(--bg); min-height: 100dvh; }
  body {
    display: flex; flex-direction: column;
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent),
      radial-gradient(ellipse 700px 400px at 100% 0%, color-mix(in srgb, var(--accent2) 7%, transparent), transparent);
    background-attachment: fixed;
  }
  a { color: var(--accent); text-decoration: none; }
  button { cursor: pointer; font: inherit; }
  input, select, textarea { font: inherit; }
  h1, h2, h3 { font-family: var(--font-heading); letter-spacing: .01em; }
  :root[data-contrast="high"] body { background-image: none; }

  /* ── Ornaments ── */
  .ornament { display: flex; align-items: center; gap: 10px; margin: 22px 0; color: var(--accent2); opacity: .8; font-size: .75em; letter-spacing: .3em; text-transform: uppercase; }
  .ornament::before, .ornament::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--accent2), transparent); }
  :root[data-contrast="high"] .ornament { opacity: 1; }
  .bismillah { text-align: center; font-family: var(--font-arabic); direction: rtl; font-size: 1.5em; color: var(--accent2); margin: 4px 0 2px; }

  /* ── Layout ── */
  #app { display: flex; flex-direction: column; min-height: 100dvh; }
  #header {
    position: sticky; top: 0; z-index: 100;
    background: color-mix(in srgb, var(--bg2) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 0 color-mix(in srgb, var(--accent2) 35%, transparent);
    padding: 10px 16px; display: flex; align-items: center; gap: 12px;
  }
  #header { flex-wrap: nowrap; }
  #header .logo { font-size: 1.15em; font-weight: 700; color: var(--fg); display: flex; align-items: center; gap: 8px; min-width: 0; flex-shrink: 1; }
  #header .logo span[data-i18n="app_name"] { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #header .logo .mark {
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent-grad); box-shadow: var(--shadow); font-size: 1.05em;
  }
  #header .logo span { background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  :root[data-contrast="high"] #header .logo span { background: none; -webkit-text-fill-color: unset; color: var(--fg); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  #header .nav { display: flex; gap: 4px; }
  #header .nav a, #header .nav button { background: none; border: none; color: var(--muted); padding: 8px 12px; border-radius: 8px; font-size: 0.9em; transition: color .15s, background .15s; }
  #header .nav a:hover, #header .nav button:hover, #header .nav a.active { color: var(--fg); background: var(--card); }
  #header-tools { display: flex; align-items: center; gap: 4px; }

  /* ── Real-time header clock ── */
  .header-clock { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; padding-inline: 10px; border-inline: 1px solid var(--line); }
  .hc-time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.05em; letter-spacing: .02em; color: var(--fg); }
  .hc-colon { animation: hcBlink 1s steps(1, end) infinite; color: var(--accent2); }
  @media (prefers-reduced-motion: reduce) { .hc-colon { animation: none; } }
  @keyframes hcBlink { 50% { opacity: .15; } }
  .hc-date { font-size: .78em; color: var(--muted); text-transform: capitalize; }
  @media (max-width: 700px) { .hc-date { display: none; } }
  @media (max-width: 460px) { .hc-sec { display: none; } .header-clock { padding-inline: 6px; } }
  @media (max-width: 340px) { .header-clock { display: none; } }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid transparent; background: none; color: var(--muted); font-size: 1.05em; transition: all .15s var(--ease); }
  .icon-btn:hover { color: var(--fg); background: var(--card); border-color: var(--line); }
  select.lang-quick { background: var(--card2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font-size: .85em; max-width: 110px; }
  @media (max-width: 460px) { select.lang-quick { max-width: 64px; } }
  #main { flex: 1; padding: 16px; max-width: 1200px; margin: 0 auto; width: 100%; }
  #main.page-enter { animation: pageIn .28s var(--ease) both; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #main.page-enter { animation: none; } }
  #footer { border-top: 1px solid var(--line); padding: 12px 16px; text-align: center; color: var(--muted); font-size: 0.85em; }

  /* ── Cards ── */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); position: relative; }
  .card-header { font-size: 1.1em; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-family: var(--font-heading); }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card-accent { border-top: 3px solid transparent; border-image: var(--gold-grad) 1; }
  .card-link { cursor: pointer; transition: transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s; }
  .card-link:hover { transform: translateY(-3px); box-shadow: 0 16px 34px -14px rgba(0,0,0,.35); border-color: color-mix(in srgb, var(--accent2) 45%, var(--line)); }
  @media (prefers-reduced-motion: reduce) { .card-link:hover { transform: none; } }
  .icon-badge { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 14%, var(--card2)); font-size: 1.5em; flex-shrink: 0; }

  /* ── Buttons ── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; border-radius: 10px; border: none; font-weight: 600; transition: all 0.15s var(--ease); min-height: 44px; }
  .btn-primary { background: var(--accent-grad); color: var(--on-accent); }
  .btn-primary:hover { filter: brightness(1.12); transform: translateY(-1px); box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--accent) 60%, transparent); }
  .btn-gold { background: var(--gold-grad); color: #241c04; }
  .btn-gold:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-secondary { background: var(--card2); color: var(--fg); border: 1px solid var(--line); }
  .btn-secondary:hover { border-color: var(--accent2); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 6px 14px; font-size: 0.85em; min-height: 36px; }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
  .btn:focus-visible, .icon-btn:focus-visible, a:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }

  /* ── Forms ── */
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: var(--muted); font-size: 0.9em; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg2); color: var(--fg); }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,107,74,0.15); }

  /* ── Prayer Time Display ── */
  .prayer-times-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .prayer-card { text-align: center; padding: 16px 12px; background: var(--card2); border-radius: 12px; border: 1px solid var(--line); transition: border-color .2s, box-shadow .2s; }
  .prayer-card.active { border-color: var(--accent2); background: color-mix(in srgb, var(--accent) 12%, var(--card2)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent2) 40%, transparent); }
  .prayer-card .name { font-size: 0.9em; color: var(--muted); margin-bottom: 4px; }
  .prayer-card .time { font-size: 1.4em; font-weight: 700; }
  .prayer-card .type { font-size: 0.75em; color: var(--muted); margin-top: 2px; }

  /* ── Countdown ── */
  .countdown { text-align: center; padding: 24px; }
  .countdown .next-prayer { font-size: 1.8em; font-weight: 700; color: var(--accent); }
  .countdown .timer { font-size: 2.5em; font-weight: 700; margin: 8px 0; }
  .countdown .label { color: var(--muted); }

  /* ── Radial Gauge (countdown ring) ── */
  .gauge { --gauge-pct: 0; width: 148px; height: 148px; margin: 0 auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; background: conic-gradient(var(--accent2) calc(var(--gauge-pct) * 1%), var(--line) 0); }
  .gauge::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--card); box-shadow: inset 0 2px 8px rgba(0,0,0,.15); }
  .gauge .gauge-inner { position: relative; z-index: 1; text-align: center; }
  .gauge .gauge-inner .timer { font-size: 1.5em; font-weight: 700; margin: 0; }
  .gauge .gauge-inner .label { font-size: .68em; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) { .gauge { transition: background 1s var(--ease); } }

  /* ── Live badge ── */
  .badge-live { font-size: .78em; padding: 4px 10px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); color: var(--muted); }
  .badge-live.live { color: #fff; background: var(--danger); border-color: transparent; animation: livePulse 2s ease-in-out infinite; }
  @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: .65; } }
  @media (prefers-reduced-motion: reduce) { .badge-live.live { animation: none; } }

  /* ── Khutbah Live ── */
  .khutbah-segment { padding: 12px 16px; border-left: 3px solid var(--accent2); margin-bottom: 8px; background: var(--card2); border-radius: 0 8px 8px 0; }
  .khutbah-segment .arabic { font-size: 1.3em; color: var(--accent2); direction: rtl; text-align: right; margin-bottom: 4px; font-family: "Noto Naskh Arabic", serif; }
  .khutbah-segment .translation { font-size: 1em; }
  .khutbah-segment.degraded { border-left-color: var(--warn); opacity: 0.8; }
  .khutbah-segment.quran { border-left-color: var(--accent); background: rgba(26,107,74,0.08); }

  /* ── Quran Reader ── */
  .ayah { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .ayah .arabic { font-size: 1.4em; direction: rtl; text-align: right; font-family: "Noto Naskh Arabic", serif; line-height: 1.8; }
  .ayah .translation { color: var(--muted); margin-top: 4px; }
  .ayah .ref { font-size: 0.75em; color: var(--accent); }

  /* ── Announcements ── */
  .announcement-item { padding: 16px; border-left: 4px solid var(--accent); margin-bottom: 12px; }
  .announcement-item.urgent { border-left-color: var(--danger); }
  .announcement-item .title { font-weight: 600; margin-bottom: 4px; }
  .announcement-item .body { color: var(--muted); }
  .announcement-item .meta { font-size: 0.8em; color: var(--muted); margin-top: 8px; }

  /* ── Toast ── */
  #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast { padding: 12px 20px; border-radius: 10px; color: #fff; font-weight: 500; animation: slideIn 0.3s; min-width: 200px; }
  .toast-success { background: var(--ok); }
  .toast-error { background: var(--danger); }
  .toast-info { background: var(--accent); }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* ── Modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--card); border-radius: var(--radius); padding: 24px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; }
  .modal-header { font-size: 1.2em; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 1.5em; padding: 4px 8px; }

  /* ── Loading ── */
  .spinner { width: 24px; height: 24px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-center { display: flex; align-items: center; justify-content: center; padding: 40px; gap: 12px; }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    #header .nav { display: none; }
    .card-grid { grid-template-columns: 1fr; }
    .prayer-times-grid { grid-template-columns: repeat(3, 1fr); }
  }

  /* ── Mobile Nav ── */
  #mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: color-mix(in srgb, var(--bg2) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 8px 0 env(safe-area-inset-bottom, 8px); z-index: 100; }
  @media (max-width: 600px) { #mobile-nav { display: flex; justify-content: space-around; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; } #mobile-nav::-webkit-scrollbar { display: none; } body { padding-bottom: env(safe-area-inset-bottom, 0); } #main { padding-bottom: 76px; } }
  #mobile-nav a { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; padding: 6px 12px; color: var(--muted); font-size: 0.7em; text-decoration: none; transition: color .15s; }
  #mobile-nav a.active, #mobile-nav a:hover { color: var(--accent2); }
  #mobile-nav a .icon { font-size: 1.8em; margin-bottom: 2px; }

  /* ── Hero (mosque background) ── */
  .hero-mosque {
    position: relative; overflow: hidden; text-align: center;
    padding: 28px 16px 22px; border-radius: var(--radius); margin-bottom: 20px;
    background-image: linear-gradient(180deg, color-mix(in srgb, var(--bg) 78%, transparent), var(--bg) 92%), url("./assets/mosque-bg.jpg");
    background-size: cover; background-position: center 65%;
    border: 1px solid var(--line);
  }
  :root[data-contrast="high"] .hero-mosque, :root[data-senior="true"] .hero-mosque { background-image: none; }
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <div class="logo"><span class="mark">🕌</span> <span data-i18n="app_name">Mosqué Digital</span></div>
    <div class="header-right">
      <nav class="nav" id="main-nav"></nav>
      <div id="header-clock" class="header-clock" role="status" aria-live="off">
        <span class="hc-time"><span class="hc-h">--</span><span class="hc-colon">:</span><span class="hc-m">--</span><span class="hc-sec"><span class="hc-colon">:</span><span class="hc-s">--</span></span></span>
        <span class="hc-date"></span>
      </div>
      <div id="header-tools">
        <select class="lang-quick" id="lang-quick" aria-label="Langue"></select>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Changer de thème">🌙</button>
      </div>
    </div>
  </header>
  <main id="main"><div class="loading-center"><div class="spinner"></div><span data-i18n="loading">Chargement...</span></div></main>
  <nav id="mobile-nav"></nav>
</div>
<div id="toast-container"></div>

<script type="module" src="./core/app.js"></script>
</body>
</html>
