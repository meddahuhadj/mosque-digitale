<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a6b4a" />
<meta name="description" content="Mosqué Digital — Plateforme numérique complète pour les mosquées" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./assets/icon-192.png" />
<title>🕌 Mosqué Digital</title>
<script>
  try {
    var _th = localStorage.getItem("theme");
    if (_th === "light" || _th === "dark") document.documentElement.setAttribute("data-theme", _th);
    var _c = localStorage.getItem("contrast");
    if (_c === "high") document.documentElement.setAttribute("data-contrast", "high");
    var _s = localStorage.getItem("senior-mode");
    if (_s === "true") document.documentElement.setAttribute("data-senior", "true");
  } catch(e) {}
</script>
<style>
  :root {
    --bg: #080e1a; --bg2: #0c1524; --card: #0f1c2e; --card2: #0a1622;
    --line: #1a2d4a; --fg: #e8f0f7; --muted: #8da3bd;
    --accent: #1a6b4a; --accent2: #c9a84c; --on-accent: #fff;
    --danger: #dc3545; --warn: #d4a017; --ok: #28a745;
    --radius: 16px; --fs: 16px;
    --shadow: 0 10px 30px -12px rgba(0,0,0,.65);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f0e8; --bg2: #f0ebe0; --card: #fffdf7; --card2: #faf6ee;
      --line: #c7ba9c; --fg: #16241a; --muted: #54633f;
      --accent: #155a3e; --accent2: #8b6914; --on-accent: #fff;
      --danger: #c0392b; --warn: #8b6914; --ok: #1e7a34;
      --shadow: 0 12px 32px -14px rgba(20,30,10,.18);
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f0e8; --bg2: #f0ebe0; --card: #fffdf7; --card2: #faf6ee;
    --line: #c7ba9c; --fg: #16241a; --muted: #54633f;
    --accent: #155a3e; --accent2: #8b6914; --on-accent: #fff;
    --danger: #c0392b; --warn: #8b6914; --ok: #1e7a34;
    --shadow: 0 12px 32px -14px rgba(20,30,10,.18);
  }
  :root[data-contrast="high"] {
    --bg: #000; --bg2: #000; --card: #111; --card2: #000;
    --line: #444; --fg: #fff; --muted: #ccc;
    --accent: #00ff88; --accent2: #ffdd00; --on-accent: #000;
  }
  :root[data-senior="true"] {
    --fs: 22px; --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif; font-size: var(--fs); line-height: 1.5; color: var(--fg); background: var(--bg); min-height: 100dvh; }
  body { display: flex; flex-direction: column; }
  a { color: var(--accent); text-decoration: none; }
  button { cursor: pointer; font: inherit; }
  input, select, textarea { font: inherit; }

  /* ── Layout ── */
  #app { display: flex; flex-direction: column; min-height: 100dvh; }
  #header { position: sticky; top: 0; z-index: 100; background: var(--bg2); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  #header .logo { font-size: 1.2em; font-weight: 700; color: var(--accent); }
  #header .nav { margin-left: auto; display: flex; gap: 8px; }
  #header .nav a, #header .nav button { background: none; border: none; color: var(--muted); padding: 8px 12px; border-radius: 8px; font-size: 0.9em; }
  #header .nav a:hover, #header .nav button:hover, #header .nav a.active { color: var(--fg); background: var(--card); }
  #main { flex: 1; padding: 16px; max-width: 1200px; margin: 0 auto; width: 100%; }
  #footer { border-top: 1px solid var(--line); padding: 12px 16px; text-align: center; color: var(--muted); font-size: 0.85em; }

  /* ── Cards ── */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card-header { font-size: 1.1em; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

  /* ── Buttons ── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; border-radius: 10px; border: none; font-weight: 600; transition: all 0.15s; min-height: 44px; }
  .btn-primary { background: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-secondary { background: var(--card2); color: var(--fg); border: 1px solid var(--line); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 6px 14px; font-size: 0.85em; min-height: 36px; }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Forms ── */
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: var(--muted); font-size: 0.9em; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg2); color: var(--fg); }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,107,74,0.15); }

  /* ── Prayer Time Display ── */
  .prayer-times-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .prayer-card { text-align: center; padding: 16px 12px; background: var(--card2); border-radius: 12px; border: 1px solid var(--line); }
  .prayer-card.active { border-color: var(--accent); background: rgba(26,107,74,0.1); }
  .prayer-card .name { font-size: 0.9em; color: var(--muted); margin-bottom: 4px; }
  .prayer-card .time { font-size: 1.4em; font-weight: 700; }
  .prayer-card .type { font-size: 0.75em; color: var(--muted); margin-top: 2px; }

  /* ── Countdown ── */
  .countdown { text-align: center; padding: 24px; }
  .countdown .next-prayer { font-size: 1.8em; font-weight: 700; color: var(--accent); }
  .countdown .timer { font-size: 2.5em; font-weight: 700; margin: 8px 0; }
  .countdown .label { color: var(--muted); }

  /* ── Khutbah Live ── */
  .khutbah-segment { padding: 12px 16px; border-left: 3px solid var(--accent2); margin-bottom: 8px; background: var(--card2); border-radius: 0 8px 8px 0; }
  .khutbah-segment .arabic { font-size: 1.3em; color: var(--accent2); direction: rtl; text-align: right; margin-bottom: 4px; font-family: "Noto Naskh Arabic", serif; }
  .khutbah-segment .translation { font-size: 1em; }
  .khutbah-segment.degraded { border-left-color: var(--warn); opacity: 0.8; }
  .khutbah-segment.quran { border-left-color: var(--accent); background: rgba(26,107,74,0.08); }

  /* ── Quran Reader ── */
  .ayah { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .ayah .arabic { font-size: 1.4em; direction: rtl; text-align: right; font-family: "Noto Naskh Arabic", serif; line-height: 1.8; }
  .ayah .translation { color: var(--muted); margin-top: 4px; }
  .ayah .ref { font-size: 0.75em; color: var(--accent); }

  /* ── Announcements ── */
  .announcement-item { padding: 16px; border-left: 4px solid var(--accent); margin-bottom: 12px; }
  .announcement-item.urgent { border-left-color: var(--danger); }
  .announcement-item .title { font-weight: 600; margin-bottom: 4px; }
  .announcement-item .body { color: var(--muted); }
  .announcement-item .meta { font-size: 0.8em; color: var(--muted); margin-top: 8px; }

  /* ── Toast ── */
  #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast { padding: 12px 20px; border-radius: 10px; color: #fff; font-weight: 500; animation: slideIn 0.3s; min-width: 200px; }
  .toast-success { background: var(--ok); }
  .toast-error { background: var(--danger); }
  .toast-info { background: var(--accent); }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* ── Modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--card); border-radius: var(--radius); padding: 24px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; }
  .modal-header { font-size: 1.2em; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 1.5em; padding: 4px 8px; }

  /* ── Loading ── */
  .spinner { width: 24px; height: 24px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-center { display: flex; align-items: center; justify-content: center; padding: 40px; gap: 12px; }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    #header .nav { display: none; }
    .card-grid { grid-template-columns: 1fr; }
    .prayer-times-grid { grid-template-columns: repeat(3, 1fr); }
  }

  /* ── Mobile Nav ── */
  #mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg2); border-top: 1px solid var(--line); padding: 8px 0 env(safe-area-inset-bottom, 8px); z-index: 100; }
  @media (max-width: 600px) { #mobile-nav { display: flex; justify-content: space-around; } }
  #mobile-nav a { display: flex; flex-direction: column; align-items: center; padding: 6px 12px; color: var(--muted); font-size: 0.7em; text-decoration: none; }
  #mobile-nav a.active, #mobile-nav a:hover { color: var(--accent); }
  #mobile-nav a .icon { font-size: 1.8em; margin-bottom: 2px; }
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <div class="logo">🕌 <span data-i18n="app_name">Mosqué Digital</span></div>
    <nav class="nav" id="main-nav"></nav>
  </header>
  <main id="main"><div class="loading-center"><div class="spinner"></div><span data-i18n="loading">Chargement...</span></div></main>
  <nav id="mobile-nav"></nav>
</div>
<div id="toast-container"></div>

<script type="module" src="./core/app.js"></script>
</body>
</html>
